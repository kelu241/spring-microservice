spring:
  logging:
    level:
      root: ERROR
  application:
    name: conversao-corrente
  config:
    import: "optional:configserver:"
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
  datasource:
    url: jdbc:h2:mem:testdb
  h2: 
    console: 
      enabled: true
server:
  port: 8000
eureka: 
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
resilience4j:
  retry:
    instances:
      circuit-api:
        max-attempts: 3
  circuitbreaker:
    instances:
      circuit-api:
        sliding-window-size: 10
management:
  tracing:
    sampling:
      probability: 1.0
  export:
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans
      
