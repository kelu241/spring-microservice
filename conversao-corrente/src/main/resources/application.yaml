spring:
  logging:
    level:
      root: ERROR
  application:
    name: conversao-corrente
  config:
    import: "optional:configserver:"
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
  datasource:
    url: jdbc:h2:mem:testdb
  h2: 
    console: 
      enabled: true
server:
  port: 8000
eureka: 
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
